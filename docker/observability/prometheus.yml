# Prometheus scrapes every service's /actuator/prometheus every 5 s (ST-27).
global:
  scrape_interval: 5s
scrape_configs:
  - job_name: tickethub-docker           # services running in containers (docker compose --profile apps)
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['event-show-service:8081', 'booking-service:8082', 'payment-service:8083',
                  'notification-service:8084', 'api-gateway:8080']
  - job_name: tickethub-local            # services started with mvn spring-boot:run on your machine
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8081', 'host.docker.internal:8082', 'host.docker.internal:8083',
                  'host.docker.internal:8084', 'host.docker.internal:8080']
