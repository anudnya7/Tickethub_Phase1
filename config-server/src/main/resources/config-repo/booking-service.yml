spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/booking_db
    username: tickethub
    # password: NOT stored here (secret). Provide env var DB_PASSWORD.

booking:
  reservation-minutes: 10        # how long an unpaid booking holds its seats (ST-09: configurable)
  max-seats-per-booking: 10
  expiry:
    enabled: true
    scan-interval-ms: 30000

clients:
  event-show:
    base-url: http://event-show-service   # service NAME resolved through Eureka
    connect-timeout-ms: 1000
    read-timeout-ms: 3000
